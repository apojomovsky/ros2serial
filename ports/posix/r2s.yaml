# Test firmware configuration: the topics the posix virtual MCU announces
# (docs/00-design.md, C10). The names are the launch-time defaults; the
# firmware renames them from its command line. bounds gives the String field
# its 8-byte capacity; the JointState bounds match the bundle's, so every
# firmware shape drops the same oversized subscription (scenario 11). The
# services serve reset and call trigger (scenario 14); the response message
# bound keeps the Trigger answer inside the frame. The spin action serves
# tf2_msgs/action/LookupTransform (scenario 15); the goal frame ids and the
# result strings stay inside the frame.
node: r2s_posix
services:
  - name: reset
    type: std_srvs/srv/Trigger
    role: server
  - name: trigger
    type: std_srvs/srv/Trigger
    role: client
actions:
  - name: spin
    type: tf2_msgs/action/LookupTransform
topics:
  - name: battery
    type: std_msgs/msg/Float32
    direction: pub
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    direction: sub
  - name: echo_vel
    type: geometry_msgs/msg/Twist
    direction: pub
  - name: log_text
    type: std_msgs/msg/String
    direction: pub
  - name: time_now
    type: builtin_interfaces/msg/Time
    direction: pub
  - name: joints
    type: sensor_msgs/msg/JointState
    direction: sub
bounds:
  std_msgs/msg/String.data: 8
  std_srvs/srv/Trigger_Response.message: 8
  std_msgs/msg/Header.frame_id: 16
  sensor_msgs/msg/JointState.name: [6, 16]
  sensor_msgs/msg/JointState.position: 6
  sensor_msgs/msg/JointState.velocity: 6
  sensor_msgs/msg/JointState.effort: 6
  tf2_msgs/action/LookupTransform_Goal.target_frame: 16
  tf2_msgs/action/LookupTransform_Goal.source_frame: 16
  tf2_msgs/action/LookupTransform_Goal.fixed_frame: 16
  geometry_msgs/msg/TransformStamped.child_frame_id: 16
  tf2_msgs/msg/TF2Error.error_string: 16

# Minimal STM32/RP2040 firmware: one published Float32 and one subscribed Twist.
node: hello_stm32
topics:
  - name: battery
    type: std_msgs/msg/Float32
    direction: pub
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    direction: sub

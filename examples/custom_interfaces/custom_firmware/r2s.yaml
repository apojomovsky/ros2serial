# Custom-type firmware: one message, one service and one action from the
# interface package beside this directory. The generated static C API is
# emitted from this file at build time, so no generated bytes live here.
node: custom_board
distro: jazzy
topics:
  - name: reading
    type: custom_interfaces/msg/SensorReading
    direction: pub
services:
  - name: calibrate
    type: custom_interfaces/srv/Calibrate
    role: server
actions:
  - name: run
    type: custom_interfaces/action/Run
# The topic walk sizes the frame from topic payloads and announces; a service
# or action announce carries a longer type name, so the limit is raised here.
limits:
  max_frame: 64
bounds:
  custom_interfaces/srv/Calibrate_Response.note: 16
  custom_interfaces/action/Run_Result.note: 16

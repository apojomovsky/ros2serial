# Minimal CH32V example: one published Float32 and one subscribed Twist.
node: ch32v_minimal
topics:
  - name: battery
    type: std_msgs/msg/Float32
    direction: pub
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    direction: sub

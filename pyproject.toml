# Repository-wide tool configuration. The generator gets its own package
# metadata under gen/ (G1).

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
# The generator is importable from its tests without installing it (G1 packages it).
pythonpath = ["gen"]

# Repository-wide tool configuration. The generator's package metadata and
# build backend live under gen/.

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
addopts = "-q"
# The generator is importable from its tests without installing it.
pythonpath = ["gen"]

# Nightly-only mutation testing (scripts/run-mutation.sh in the
# docker/mutation image). Its configuration is not here: mutmut maps a
# source path to a module name from the directory it runs in, so
# scripts/stage-mutmut-workspace.sh writes the configuration in the
# workspace it stages, and nothing runs mutmut from the repository root.

# Generator line and branch coverage. The gate passes the same scope as
# flags, so this stays a local-run default rather than the judge.
[tool.coverage.run]
branch = true
source = ["gen/r2s_gen"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# Repository-wide tool configuration. The generator's package metadata and
# build backend live under gen/.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
# The generator is importable from its tests without installing it.
pythonpath = ["gen"]

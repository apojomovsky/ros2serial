# One task per ci-test.sh section: a section reruns only when the files it
# reads change. Task hashes each task's `sources:` with `method: checksum`
# and skips a task whose inputs match its last successful run.
# `make test` runs the stale tasks; `R2S_FULL=1` forces all of them.
version: "3"
method: checksum

# Lint and commits always run, as CHEAP did. Mermaid stays out of the
# default task (host-only) while the plan gates its job on its status.

# Git-ignored build outputs never count as inputs, so a tree that just ran
# its sections is fresh on the next status check.
use_gitignore: true

tasks:
  default:
    desc: Run every section whose inputs changed.
    deps: [lint, commits, scripts, core, gen, bridge, ament_lint, cpp, coverage, docs, examples, esp32, pic, budgets, readme, fuzz, e2e-avr, e2e-posix, nightly]

  # What the pre-push hook and the takeoff run: only the fast gates that
  # catch the mistakes a push actually makes. Everything else stays in the
  # default task and runs in CI on every pull request: scripts, bridge,
  # ament_lint, coverage, examples, budgets, readme and fuzz are too slow
  # for a host several agents push from under one suite lock, and the
  # end-to-end ones (e2e-avr, e2e-posix and the nightly isolation pairs)
  # assume a quiet host for their timing bounds, which a shared one is not;
  # the ESP32 Arduino core and the epic-cc bundle install only in their CI
  # jobs. A green push means the fast gates passed, never that the PR is
  # green.
  local:
    desc: Run the stale fast gates; CI runs the rest on every pull request.
    deps: [lint, commits, core, gen, cpp, docs]

  # The standing cheap gates: unlistable inputs must never skip them.
  lint:
    desc: The LINT section, always.
    cmds:
      - LINT=1 bash scripts/ci-test.sh

  commits:
    desc: Always checks the commit range, which no file lists.
    cmds:
      - COMMITS=1 bash scripts/ci-test.sh

  # Every section runs through this machinery and image, so every section
  # lists it: the runner and its locks, the shared plumbing the sections
  # execute, and the image definition. Each task repeats the block so the
  # PR lists every section with its full sources in one place.
  scripts:
    desc: Runs pytest over scripts/ and tools/.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      # The scope itself: its tests, the tools they exercise, the hooks and
      # workflows they run, and the repo metadata they assert on.
      - scripts/**
      - tools/**
      - .githooks/**
      - .github/**
      - pyproject.toml
      - conftest.py
      - cliff.toml
      - AGENTS.md
      - VERSION
      # Conformance vectors and the fuzzer seeds generated from them.
      - spec/**
      # The overlap, skip and bound tests load the legs they gate.
      - tests/e2e/**
      # The release tests stage the generator package and the C++ layer,
      # and the extractor tests run the package. The generator's own tests
      # stay with the gen task: they exercise the package, not its outputs.
      - gen/**
      - exclude: gen/tests/**
      - cpp/include/**
      - cpp/src/**
      - cpp/CMakeLists.txt
      # The Arduino zip stages the core and the port glue and compiles them.
      - core/include/**
      - core/src/**
      - core/tests/CMakeLists.txt
      - core/fuzz/corpus/**
      - ports/arduino/**
      # The benchmark test compiles and runs the framing benchmark.
      - benchmark/**
      # The release tests pin the checked-in generated outputs.
      - examples/cmake_minimal/lib/**
      - examples/cmake_minimal/r2s.yaml
      - ports/posix/src/**
      - ports/posix/r2s.yaml
    cmds:
      - SCRIPTS=1 bash scripts/ci-test.sh

  core:
    desc: Runs the host unit, contract and port tests.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/core-test.sh
      # The host library builds the core for the generator model tests.
      - scripts/build-host-lib.sh
      - core/**
      # Vectors replay through the conformance runners.
      - spec/**
      # The scope runs the posix and arduino port contract tests.
      - ports/posix/**
      - ports/arduino/**
    cmds:
      - CORE=1 bash scripts/ci-test.sh

  gen:
    desc: Runs the generator unit, golden and model tests.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/build-host-lib.sh
      # The packages, their tests and their goldens, listed separately so
      # the tests stay with this task only: nothing else reads them.
      - gen/r2s_gen/**
      - gen/r2s_rosidl/**
      - gen/tests/**
      - gen/pyproject.toml
      - gen/setup.py
      - gen/setup.cfg
      - gen/package.xml
      - gen/rosdoc2.yaml
      - gen/doc/**
      - gen/resource/**
      - spec/**
      # The model tests drive the real core through the host library.
      - core/**
      # The golden tests compare the checked-in generated outputs.
      - examples/cmake_minimal/lib/**
    cmds:
      - GEN=1 bash scripts/ci-test.sh

  bridge:
    desc: Runs the colcon build and test per distro.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/bridge-test.sh
      - bridge/**
      # The framing library links the core.
      - core/**
      # The hash test takes its type hashes from the generator package.
      - gen/**
      - exclude: gen/tests/**
      - spec/**
      # The launch test rebuilds the posix firmware and loads the relay.
      - ports/posix/**
      - tests/e2e/**
      - exclude: tests/e2e/test_isolation.py
    cmds:
      - BRIDGE=1 bash scripts/ci-test.sh

  ament_lint:
    desc: Runs ament_lint_common on the ROS packages, advisory.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/ament-lint.sh
      - bridge/r2s_bridge/**
      - gen/r2s_gen/**
      - gen/r2s_rosidl/**
      - gen/tests/**
      - gen/package.xml
      - gen/pyproject.toml
      - gen/setup.py
      - gen/setup.cfg
      - gen/resource/**
    cmds:
      - AMENT_LINT=1 bash scripts/ci-test.sh

  cpp:
    desc: Runs the host builds and avr compile tests.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/cpp-test.sh
      - cpp/**
      # The host tests build the core sources in.
      - core/**
    cmds:
      - CPP=1 bash scripts/ci-test.sh

  coverage:
    desc: Runs the head-vs-base gates per component.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/coverage-gate.sh
      - scripts/coverage-filters.sh
      - scripts/build-host-lib.sh
      - tools/coverage_gate.py
      # The gate measures the core and the bridge builds.
      - core/**
      - bridge/**
      # The gate measures the generator tests under coverage.py.
      - gen/r2s_gen/**
      - gen/tests/**
    cmds:
      - COVERAGE=1 bash scripts/ci-test.sh

  docs:
    desc: Extracts and compiles every snippet.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - tools/snippets_check.py
      - tools/site_build.py
      - tools/site_links.py
      - README.md
      - docs/**
      # Snippets compile against the core and the C++ layer, and the
      # reference runs the generator package.
      - core/**
      - cpp/**
      - gen/**
      - exclude: gen/tests/**
    cmds:
      - DOCS=1 bash scripts/ci-test.sh

  examples:
    desc: Builds the firmware and sketches per board.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/build-examples.sh
      - examples/**
      # The bundle is emitted at build time; the core, the runtime layer
      # and the port glue are staged into it.
      - gen/**
      - exclude: gen/tests/**
      - core/**
      - cpp/**
      - ports/arduino/**
    cmds:
      - EXAMPLES=1 bash scripts/ci-test.sh

  budgets:
    desc: Measures flash, RAM and stack against the floors.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/budgets-check.sh
      - scripts/build-examples.sh
      - scripts/build-examples-esp32.sh
      - tools/budgets.yaml
      - tools/size_report.py
      - tools/stack_report.py
      - tools/budgets_table.py
      - docs/budgets.md
      # The gate rebuilds the example sketches, so it reads what they build.
      - examples/**
      - gen/**
      - exclude: gen/tests/**
      - core/**
      - cpp/**
      - ports/arduino/**
    cmds:
      - BUDGETS=1 bash scripts/ci-test.sh

  esp32:
    desc: Builds the example sketches for the ESP32 Dev Module.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/build-examples-esp32.sh
      - examples/**
      # The bundle is emitted at build time; the core, the runtime layer
      # and the port glue are staged into it.
      - gen/**
      - exclude: gen/tests/**
      - core/**
      - cpp/**
      - ports/arduino/**
    cmds:
      - ESP32=1 bash scripts/ci-test.sh

  pic:
    desc: Compiles the core and the static C++ sketch with epic-cc.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/build-pic-canary.sh
      - core/**
      - cpp/**
      # The checked-in bundled tables the canary links.
      - gen/tests/golden/bundle/r2s_bundled.c
    cmds:
      - PIC=1 bash scripts/ci-test.sh

  readme:
    desc: Runs the walkthrough on simavr.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/check-readme.sh
      - README.md
      # The walkthrough installs the generator, stages the library from the
      # core, the runtime layer and the port glue, compiles the minimal
      # sketch, then runs it on the harness against a built bridge.
      - gen/**
      - exclude: gen/tests/**
      - core/**
      - cpp/**
      - ports/arduino/**
      - examples/arduino_minimal/**
      - bridge/**
      - tests/harness/**
    cmds:
      - README=1 bash scripts/ci-test.sh

  fuzz:
    desc: Runs the libFuzzer targets over the seed corpus.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - scripts/fuzz.sh
      - tools/fuzz_corpus.py
      # Every target parses the core; the seeds come from the vectors.
      - core/**
      - spec/**
    cmds:
      - FUZZ=1 bash scripts/ci-test.sh

  e2e-avr:
    desc: Runs the avr scenarios on simavr firmware.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      # The legs launch the bridge against firmware built from the core,
      # the runtime layer and the arduino port glue.
      - core/**
      - cpp/**
      - bridge/**
      - ports/arduino/**
      # The shared leg files. The posix runner, the posix scenarios and the
      # posix firmware helper stay with the posix leg; the isolation pairs
      # and the soak checks run in the nightly workflow instead.
      - tests/e2e/**
      - exclude: tests/e2e/run.sh
      - exclude: tests/e2e/legs.list
      - exclude: tests/e2e/scenarios.list
      - exclude: tests/e2e/scenarios-compat.list
      - exclude: tests/e2e/test_*_posix.py
      - exclude: tests/e2e/e2e_support/firmware.py
      - exclude: tests/e2e/test_isolation.py
      - exclude: tests/e2e/run-soak.sh
      - exclude: tests/e2e/e2e_support/soak.py
      - exclude: tests/e2e/test_soak_avr.py
      - exclude: tests/e2e/test_soak_posix.py
      - exclude: tests/e2e/soak_check_test.py
      - tests/harness/**
    cmds:
      - E2E=avr bash scripts/ci-test.sh

  e2e-posix:
    desc: Runs the posix scenarios on the virtual MCU.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      - core/**
      - bridge/**
      # The leg builds and launches the posix firmware shapes. The avr-only
      # files stay with the avr leg; the isolation pairs and the soak checks
      # run in the nightly workflow instead.
      - ports/posix/**
      - tests/e2e/**
      - exclude: tests/e2e/run-avr.sh
      - exclude: tests/e2e/test_*_avr.py
      - exclude: tests/e2e/e2e_support/avr.py
      - exclude: tests/e2e/avr_slice/**
      - exclude: tests/e2e/avr_flood/**
      - exclude: tests/e2e/test_isolation.py
      - exclude: tests/e2e/run-soak.sh
      - exclude: tests/e2e/e2e_support/soak.py
      - exclude: tests/e2e/test_soak_avr.py
      - exclude: tests/e2e/test_soak_posix.py
      - exclude: tests/e2e/soak_check_test.py
    cmds:
      - E2E=posix bash scripts/ci-test.sh

  nightly:
    desc: Runs the e2e isolation pairs side by side.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      # The pairs exercise the legs the e2e tasks cover; only the pair
      # file itself selects this task on a pull request.
      - tests/e2e/test_isolation.py
    cmds:
      - NIGHTLY=1 bash scripts/ci-test.sh

  soak:
    desc: Runs the two hour soak on posix and simavr.
    sources:
      - Taskfile.yml
      - .gitignore
      - Dockerfile
      - .dockerignore
      - ci/versions.env
      - Makefile
      - scripts/pass-vars.list
      - scripts/ci-test.sh
      - scripts/run-tasks.sh
      - scripts/suite-lock.sh
      - scripts/clean-git-env.sh
      - scripts/with-build-lock.sh
      - scripts/e2e-lease.sh
      # The soak driver, its helpers and its checks. The soak runs on
      # schedule only: ci.yml keeps it off on pull requests, so the plan
      # carries no soak output and nothing restores this checksum. The task
      # stays out of the default task so an unscoped run never starts the
      # multi-hour soak; `make test SOAK=1` runs it by name.
      - tests/e2e/run-soak.sh
      - tests/e2e/e2e_support/soak.py
      - tests/e2e/test_soak_avr.py
      - tests/e2e/test_soak_posix.py
      - tests/e2e/soak_check_test.py
      # Both backend worlds it drives traffic over.
      - core/**
      - bridge/**
      - ports/posix/**
      - ports/arduino/**
      - cpp/**
      - tests/harness/**
      - tests/e2e/e2e_support/**
    cmds:
      - SOAK=1 bash scripts/ci-test.sh

  # Host-only: needs docker, so the dev image cannot run it. No image task
  # depends on it; the plan gates the mermaid job on its status, and the job
  # runs `make lint-docs`, the same command below.
  mermaid:
    desc: The mermaid blocks, parsed by mermaid itself on the host.
    sources:
      - Taskfile.yml
      - .gitignore
      - ci/versions.env
      - scripts/lint-docs.sh
      - tools/mermaid-check/**
      - "**/*.md"
    cmds:
      - bash scripts/lint-docs.sh

  # Host-only: builds docker/bigendian and runs the portable scope inside it
  # under qemu-s390x, so the dev image cannot run it either. It stays out of
  # the default and local tasks, as the mermaid check does, and CI never
  # plans it: the nightly workflow runs it with `task bigendian`, and it is
  # planless like the schedule-only soak. The bridge stays out: rclcpp is not
  # available cross-compiled.
  bigendian:
    desc: Cross-build the core for s390x and run the suite under qemu (host-only, needs docker).
    sources:
      - Taskfile.yml
      - .gitignore
      - ci/versions.env
      - docker/bigendian/**
      - scripts/run-bigendian.sh
      - scripts/bigendian-suite.sh
      - scripts/build-host-lib.sh
      - tools/vectors_check.py
      - tools/unity_runner.py
      - core/**
      - spec/**
      - gen/r2s_gen/**
    cmds:
      - bash scripts/run-bigendian.sh

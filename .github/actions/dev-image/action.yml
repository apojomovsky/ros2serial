name: dev-image
description: Build the dev image from ci/versions.env, cached in the GitHub Actions cache, and load it.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4.4.1
    - id: meta
      shell: bash
      run: |
        echo "tag=$(bash scripts/dev-image-tag.sh)" >> "$GITHUB_OUTPUT"
        { echo 'args<<EOF'; grep -v '^#' ci/versions.env; echo EOF; } >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@v7.4.0
      with:
        context: .
        target: dev
        load: true
        tags: ${{ steps.meta.outputs.tag }}
        build-args: ${{ steps.meta.outputs.args }}
        cache-from: type=gha,scope=dev
        cache-to: type=gha,mode=max,scope=dev

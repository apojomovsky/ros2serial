name: nightly-jobs

# The runs too long or too exhaustive for a PR: the long fuzzing, the
# soak, mutation testing and the big-endian qemu job. nightly.yml calls
# this on schedule; release.yml calls it on a tag before anything is
# published, without the long fuzzing: fuzzing for a fixed time is
# exploration, and CI already replays the seed corpus. The soak stays off
# there too, and on PRs.
# Timeout floor (see the rule comment in ci.yml): image jobs carry 30 or more.
on:
  workflow_call:
    inputs:
      fuzz:
        description: Run the long fuzzing
        type: boolean
        default: true
      soak:
        description: Run the two hour soak on posix and simavr
        type: boolean
        default: false
      mutation:
        description: Run mutation testing and publish the triage report
        type: boolean
        default: true
      bigendian:
        description: Run the core and the reference codec on a big-endian target under qemu
        type: boolean
        default: true

permissions:
  contents: read

# Runs outside pull requests force their sections; pull requests run stale ones.
env:
  R2S_FULL: ${{ github.event_name == 'pull_request' && '' || '1' }}

jobs:
  fuzz-long:
    if: ${{ inputs.fuzz }}
    runs-on: ubuntu-24.04
    # Four targets at R2S_FUZZ_SECONDS each, plus the image floor.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test FUZZ=1
        env:
          R2S_FUZZ_SECONDS: 1800
          R2S_FUZZ_ARTIFACTS_DIR: fuzz-artifacts
      # Seed-corpus coverage, deterministic and quick: which lines each
      # target's seeds reach, as a report and never a gate. The same run
      # keeps whatever the seeds add, so the upload below holds both.
      - run: make test FUZZ=1
        env:
          R2S_FUZZ_SECONDS: 0
          R2S_FUZZ_COVERAGE: 1
          R2S_FUZZ_ARTIFACTS_DIR: fuzz-artifacts
      - if: always()
        run: |
          if [ -f fuzz-artifacts/coverage/fuzz-coverage.md ]; then
            cat fuzz-artifacts/coverage/fuzz-coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage
          path: fuzz-artifacts/coverage/
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-new-inputs
          path: fuzz-artifacts/
          if-no-files-found: warn
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/fuzz
          key: r2s-task-fuzz-refs/heads/master-${{ github.sha }}

  # Two hours of clean-link traffic on each soak backend. The wire counters
  # must stay exactly consistent and the bridge memory must plateau, as the
  # soak scope checks; a short R2S_SOAK_SECONDS keeps local runs in minutes.
  soak:
    if: ${{ inputs.soak }}
    runs-on: ubuntu-24.04
    # One R2S_SOAK_SECONDS window per backend in run-soak.sh, plus the floor.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test SOAK=1
        env:
          R2S_SOAK_SECONDS: 7200

  # Nightly-only mutation testing in its own image: Mull over the core,
  # mutmut over the generator. It publishes a triage report to the run
  # summary and an artifact, and a measured score below its floor in
  # tools/robustness.yaml fails this job once the report is written, so
  # the scheduled failure reporter files the regression. Pull requests
  # and the pre-PR ritual never run it: the gate is nightly-only.
  mutation:
    if: ${{ inputs.mutation }}
    runs-on: ubuntu-24.04
    # Mull runs every unit binary once per mutant and mutmut runs the
    # covering gen tests per mutant; both suites take seconds to minutes
    # unmutated, so two hours leaves wide headroom. Past it, the scheduled
    # failure reporter files the hang instead of holding a runner.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/mutation/Dockerfile
          load: true
          tags: ros2serial-mutation:local
          cache-from: type=gha,scope=mutation
          cache-to: type=gha,mode=max,scope=mutation
      - run: |
          mkdir -p mutation-report
          docker run --rm -v "$PWD:/src" -w /src ros2serial-mutation:local \
            bash scripts/run-mutation.sh
      # The report is the deliverable: best effort on a broken run, so a
      # failure still leaves whatever the tools produced before it stopped.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report/
      - if: always()
        run: |
          if [ -f mutation-report/report.md ]; then
            cat mutation-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # The core unit and vector tests cross-built for s390x and run under
  # qemu-user, plus the generator reference suite and the vector check, in
  # an image of their own: the dev image carries no cross toolchain or
  # emulator. Nightly only: pull request checks and the pre-PR ritual never
  # run it, so the pull request caller turns it off, and so does the
  # release call. The bridge stays out: rclcpp is not available
  # cross-compiled.
  big-endian:
    if: ${{ inputs.bigendian }}
    runs-on: ubuntu-24.04
    # The image build plus the core suite under emulation and the gen suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      # The task builds its own image and runs the suite in it, as the
      # mermaid check runs its own command: one path for CI and local runs.
      - name: Install Task
        run: sudo python3 scripts/install-task.py
      - run: task --concurrency 1 bigendian
      # No checksum save: schedule-only, nothing plans it on pull requests.

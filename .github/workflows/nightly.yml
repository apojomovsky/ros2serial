name: nightly

# Long runs the PR suite cannot afford live in nightly-jobs.yml, called here
# on schedule and on demand. A failed scheduled run files an issue, or
# comments on the open one, so the failure is triaged instead of silent.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    uses: ./.github/workflows/nightly-jobs.yml
    # The soak is the only caller that waits two hours; releases and PRs
    # keep the default off.
    with:
      soak: true

  # Scenario 8 alone against the strict 1 ms bound, as one suite alone on
  # its runner: host scheduling jitter moves the host-side arrival stamps
  # past 1 ms under a second suite or a shared PR host, so the default
  # judges 5 ms and only this lone run judges the target. The skip list
  # names every other scenario file, so a new scenario still runs here
  # until it is listed.
  e2e-sync-strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test E2E=posix
        env:
          R2S_SYNC_BOUND_NS: 1000000
          R2S_E2E_SKIP: test_scenario_1_posix test_scenario_2_posix test_scenario_3_posix test_scenario_4_posix test_scenario_6_posix test_scenario_7_posix test_scenario_9_posix test_scenario_10_posix test_scenario_10_framing_posix test_publish_catchup_posix test_scenario_11_posix test_scenario_12_posix test_scenario_13_posix

  report-failure:
    needs: [nightly, e2e-sync-strict]
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - run: |
          title="Nightly run failed"
          body="The scheduled nightly run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label needs-triage --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

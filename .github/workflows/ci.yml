name: ci

# Every job runs `make test` with a scope inside the dev image, exactly as a
# contributor does locally. Placeholder jobs mark where each test layer lands;
# each names the ticket that fills it in.
#
# The plan job maps a pull request's changed files to the jobs they can
# affect and exposes one output per job. Each section job needs the plan and
# runs only when its output is set; workflow_dispatch and pushes to master
# run every job, and a FULL result runs every job too. A job skipped by its
# if still satisfies branch protection, so skipping is safe.
#
# Timeouts: every job that builds or pulls an image carries at least 30
# minutes. On a cold GHA cache the image step is slow, and its cache is
# written only when the job completes, so a shorter bound would cut off the
# very run that fills it. plan and bridge-images build nothing and stay at 5.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Manual runs force every section. A pull request and a push to master run
# the jobs its diff selects; the nightly sweep covers the whole tree.
env:
  R2S_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

# Pull request pushes supersede each other, so a stale review never waits
# behind an old run. Master runs never cancel: every merged commit keeps
# its own conclusion on the commits page.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Change detection by path: the plan maps the pull request's changed
  # files to the jobs those files can affect. tools/ci_jobs.py reads the
  # Taskfile's own `sources:` lists, so the map and what each section
  # reads cannot disagree; the trees every job builds in, the workflows
  # and the suite plumbing select the full matrix, and so does a path no
  # section reads. Pushes to master and manual runs keep the full matrix.
  # A job skipped by its if still satisfies branch protection, so
  # skipping is safe.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.jobs.outputs.lint }}
      ament_lint: ${{ steps.jobs.outputs.ament_lint }}
      scripts: ${{ steps.jobs.outputs.scripts }}
      core: ${{ steps.jobs.outputs.core }}
      gen: ${{ steps.jobs.outputs.gen }}
      cpp: ${{ steps.jobs.outputs.cpp }}
      docs: ${{ steps.jobs.outputs.docs }}
      mermaid: ${{ steps.jobs.outputs.mermaid }}
      readme: ${{ steps.jobs.outputs.readme }}
      coverage: ${{ steps.jobs.outputs.coverage }}
      bridge: ${{ steps.jobs.outputs.bridge }}
      e2e: ${{ steps.jobs.outputs.e2e }}
      fuzz: ${{ steps.jobs.outputs.fuzz }}
      nightly: ${{ steps.jobs.outputs.nightly }}
      examples: ${{ steps.jobs.outputs.examples }}
      esp32: ${{ steps.jobs.outputs.esp32 }}
      pic: ${{ steps.jobs.outputs.pic }}
      platformio: ${{ steps.jobs.outputs.platformio }}
      stm32: ${{ steps.jobs.outputs.stm32 }}
      rp2040: ${{ steps.jobs.outputs.rp2040 }}
      budgets: ${{ steps.jobs.outputs.budgets }}
      full: ${{ steps.jobs.outputs.full }}
    steps:
      # Full history: the map diffs the pull request against its merge base.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      # The tool reads Taskfile.yml, whose parser is PyYAML: the pinned
      # interpreter keeps the install out of the system Python.
      - name: Load pinned versions
        run: grep -v '^#' ci/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install PyYAML at the pinned version
        run: |
          pin=$(sed -n 's/^PYYAML_VERSION=//p' ci/versions.env)
          python3 -m pip install --quiet "pyyaml==$pin"
      - id: jobs
        env:
          # The base branch the map diffs against; empty off a pull request.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            base="origin/$BASE_REF"
          else
            # A push to master and a manual run keep the full matrix. The map
            # still reports the diff so the nightly caller follows the fuzz
            # selection; a squash merge's parent is the previous master tip.
            echo "full=1" >> "$GITHUB_OUTPUT"
            base=HEAD^
          fi
          # A map that fails would leave every output unset, which every
          # job's if reads as skip: fail safe to the full matrix instead.
          if ! map=$(python3 tools/ci_jobs.py --base "$base"); then
            map="full=1"
          fi
          printf '%s\n' "$map" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lint:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.lint == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: the spec coverage check compares the pending list with the PR's base.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      - run: |
          range="$(bash scripts/pr-title-range.sh)" || exit 1
          COMMIT_RANGE="$range" make test LINT=1
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

  # Advisory ament_lint_common over the ROS packages: reports the per-linter
  # baseline and never fails, until the cleanup tickets land (#508). Runs
  # through make, so the dev image provides colcon and the ROS underlay.
  ament-lint:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.ament_lint == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test AMENT_LINT=1
  # The SCRIPTS scope runs as one job per shard over the collected node
  # ids, spread round-robin in sorted order (scripts/shard_nodes.py). The
  # e2e isolation pairs run in the e2e-isolation job instead.
  scripts:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.scripts == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test SCRIPTS=1 SCRIPTS_SHARD=${{ matrix.shard }}

  core:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.core == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test CORE=1

  gen:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.gen == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test GEN=1

  cpp:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.cpp == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test CPP=1

  docs:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.docs == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test DOCS=1

  # Mermaid blocks, parsed by mermaid itself under the pinned node image
  # (never the dev image, which gains no Node). Runs when a prose page or the
  # tool changes; make lint-docs runs the same command locally.
  mermaid:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.mermaid == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/ros2serial/npm
          key: mermaid-npm-${{ hashFiles('tools/mermaid-check/package-lock.json') }}
          restore-keys: |
            mermaid-npm-
      # The host check drives docker itself: the runner needs only the CLI.
      - run: bash scripts/lint-docs.sh

  readme:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.readme == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test README=1

  coverage:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.coverage == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: the gate measures the base commit in the same run.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      - run: |
          range="$(bash scripts/pr-title-range.sh)" || exit 1
          COMMIT_RANGE="$range" make test COVERAGE=1
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

  e2e-avr:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.e2e == 'avr' || needs.plan.outputs.e2e == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test E2E=avr

  # The bridge job's distro images, resolved from ci/versions.env before it
  # starts: a job's container is fixed before any step runs, so the bridge job
  # cannot read the file itself. Always runs: it is setup, not a section.
  bridge-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
      images: ${{ steps.pins.outputs.images }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: pins
        run: bash scripts/bridge-images.sh >> "$GITHUB_OUTPUT"

  # The bridge is built and tested on every supported distro, in that distro's
  # own pinned image. The dev image is the jazzy one, so the local run and the
  # jazzy job share a toolchain.
  bridge:
    needs: [plan, bridge-images]
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.bridge == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bridge-images.outputs.matrix) }}
    container:
      image: ${{ fromJSON(needs.bridge-images.outputs.images)[matrix.distro] }}
    steps:
      - uses: actions/checkout@v4.2.2
      # The distro images carry no dev image: the runner installs pinned Task.
      - name: Install Task
        run: python3 scripts/install-task.py
      - run: make test BRIDGE=1
        env:
          R2S_IN_IMAGE: 1
          R2S_BUILD_DIR: /tmp/r2s-build

  # End-to-end on the posix virtual MCU: scenarios 1 to 4 under every RMW the
  # design names, with the Zenoh router started first on its leg. The suite
  # runs the same run.sh locally, so each leg matches `make test E2E=posix`.
  e2e-posix:
    needs: [plan, bridge-images]
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.e2e == 'posix' || needs.plan.outputs.e2e == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.bridge-images.outputs.matrix).distro }}
        rmw: [rmw_fastrtps_cpp, rmw_cyclonedds_cpp, rmw_zenoh_cpp]
    container:
      image: ${{ fromJSON(needs.bridge-images.outputs.images)[matrix.distro] }}
    steps:
      - uses: actions/checkout@v4.2.2
      - run: |
          bash scripts/apt-install.sh update
          bash scripts/apt-install.sh install -y --no-install-recommends "ros-${DISTRO}-rmw-cyclonedds-cpp" "ros-${DISTRO}-rmw-zenoh-cpp"
        env:
          DISTRO: ${{ matrix.distro }}
      # The distro images carry no dev image: the runner installs pinned Task.
      - name: Install Task
        run: python3 scripts/install-task.py
      - run: make test E2E=posix
        env:
          R2S_IN_IMAGE: 1
          R2S_BUILD_DIR: /tmp/r2s-build
          R2S_RMWS: ${{ matrix.rmw }}
          # Scenario 8's median bound: pinned to the 5 ms default for the shared host.
          R2S_SYNC_BOUND_NS: 5000000

  # Placeholders. Each becomes a real job in the ticket it names, and stays
  # out of the required checks until then.
  fuzz-smoke:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.fuzz == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test FUZZ=1

  # Two full e2e sections side by side on one host, measured about 28
  # minutes including setup (#577): the bound keeps roughly double
  # headroom. The load-sensitive scenario is skipped and the sync bound
  # keeps headroom for the shared host, as the CI e2e jobs do. A direct
  # job, not a reusable-workflow call, so the pull request shows
  # e2e-isolation instead of a nightly caller (#586).
  e2e-isolation:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.nightly == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test NIGHTLY=1
        env:
          R2S_E2E_SKIP: test_scenario_8_posix
          R2S_SYNC_BOUND_NS: 5000000
      # The failing section output leaves the runner with the scenario
      # logs: collect them on any outcome, so a timeout kill still
      # uploads what the pair proved before it stopped.
      - if: always()
        run: bash scripts/collect-isolation-logs.sh "$HOME/.cache/ros2serial" isolation-logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-isolation-logs
          path: isolation-logs/
          if-no-files-found: warn

  # The reusable nightly jobs left on a pull request: only the long
  # fuzzing, and only when the fuzz-long label opts in. The isolation
  # pairs run as the e2e-isolation job above, so no pull request runs a
  # job called nightly. The label is read from the event, so adding it
  # takes effect on the next push or rerun. The soak never runs here:
  # two hours is a schedule-only wait. A reusable workflow call takes no
  # timeout-minutes; the called jobs carry theirs.
  nightly:
    needs: plan
    # The called workflow's pic-sim job asks for packages: read, and a call
    # granting less makes this whole workflow invalid before any job runs.
    permissions:
      contents: read
      packages: read
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'fuzz-long'))
    uses: ./.github/workflows/nightly-jobs.yml
    with:
      # Schedule, master and manual runs follow the FUZZ selection; a pull
      # request runs the long fuzzing only when it carries the fuzz-long
      # label, so the two hours never gate an unlabeled pull request.
      fuzz: ${{ (github.event_name != 'pull_request' && needs.plan.outputs.fuzz == '1') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'fuzz-long')) }}
      soak: false
      # Mutation testing is nightly-only: it never runs in a pull request.
      mutation: false
      # The big-endian qemu job is nightly-only too: it never runs here.
      bigendian: false

  build-matrix:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.examples == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test EXAMPLES=1

  # The ESP32 check: the example sketches and the staged Arduino library
  # compile for the ESP32 Dev Module at the core version pinned in
  # ci/versions.env. The core lives outside the dev image, so the check
  # installs it into a cache directory the build script manages.
  esp32:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.esp32 == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/ros2serial/arduino-esp32
          key: esp32-core-${{ hashFiles('ci/versions.env') }}
          restore-keys: |
            esp32-core-
      - run: make test ESP32=1

  # The PIC canary: the core and the static C++ sketch compile with
  # epic-cc for PIC16F1938 and PIC18F4550. New epic-cc failures fail the
  # script against ci/pic-canary-baseline.txt, but only outside pull
  # requests: epic-cc is not ours to fix, so a red canary never blocks
  # a pull request. The bundle installs into a cache directory, never
  # into the dev image, and a run without the toolchain skips instead
  # of failing.
  pic-canary:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.pic == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/ros2serial/epic-cc
          key: epic-cc-${{ hashFiles('ci/versions.env') }}
          restore-keys: |
            epic-cc-
      - run: make test PIC=1
  # The STM32 firmware: the core and the generated pair link with
  # arm-none-eabi-gcc for the Blue Pill. The toolchain ships in the
  # dev image.
  stm32:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.stm32 == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test STM32=1

  # The RP2040 firmware: the core and the generated pair link with
  # arm-none-eabi-gcc for the Pico. The toolchain ships in the dev
  # image; the Pico boot stage downloads into a cache directory,
  # never into the tree.
  rp2040:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.rp2040 == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/ros2serial/pico-sdk-2.3.1
          key: pico-sdk-${{ hashFiles('ci/versions.env') }}
          restore-keys: |
            pico-sdk-
      - run: make test RP2040=1

  platformio:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.platformio == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/ros2serial/platformio
          key: platformio-${{ hashFiles('ci/versions.env') }}
          restore-keys: |
            platformio-
      - run: make test PLATFORMIO=1

  budgets:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == '1' || needs.plan.outputs.budgets == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history: the head numbers are judged by the base commit's tools.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      # The budgets build compiles the ESP32 firmware too, so it restores
      # the same cached core the esp32 job installs.
      - uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/ros2serial/arduino-esp32
          key: esp32-core-${{ hashFiles('ci/versions.env') }}
          restore-keys: |
            esp32-core-
      - run: |
          range="$(bash scripts/pr-title-range.sh)" || exit 1
          export BASE="${range%%..*}"
          set +e
          make test BUDGETS=1 | tee budgets.log
          status=${PIPESTATUS[0]}
          grep '^TABLE ' budgets.log | tail -1 | cut -d' ' -f2 > budgets-table.path
          exit "$status"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      # The table is one click from the run on every push, whether or not the
      # gate passes: an empty path means the builds failed before any table.
      - if: always()
        run: |
          if [ -s budgets-table.path ]; then
            cat "$(cat budgets-table.path)" >> "$GITHUB_STEP_SUMMARY"
          fi

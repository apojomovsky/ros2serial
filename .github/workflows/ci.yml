name: ci

# Every job runs `make test` with a scope inside the dev image, exactly as a
# contributor does locally. Placeholder jobs mark where each test layer lands;
# each names the ticket that fills it in.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      # Full history: the spec coverage check compares the pending list with the PR's base.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      - run: make test LINT=1
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test SCRIPTS=1

  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test CORE=1

  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test GEN=1

  e2e-avr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test E2E=avr

  # The bridge is built and tested on every supported distro, in that distro's
  # own image. The dev image is the jazzy one, so the local run and the jazzy
  # job share a toolchain.
  bridge:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    container:
      image: ros:${{ matrix.distro }}-ros-base
    steps:
      - uses: actions/checkout@v4.2.2
      - run: make test BRIDGE=1
        env:
          R2S_IN_IMAGE: 1
          R2S_BUILD_DIR: /tmp/r2s-build

  # Placeholders. Each becomes a real job in the ticket it names, and stays
  # out of the required checks until then.
  e2e-posix:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - run: echo "pending V1, see docs/00-design.md"
  fuzz-smoke:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - run: echo "pending C11, see docs/00-design.md"
  build-matrix:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - run: echo "pending G10, see docs/00-design.md"
  budgets:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - run: echo "pending P6, see docs/00-design.md"

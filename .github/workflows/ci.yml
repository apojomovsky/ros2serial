name: ci

# Every job runs `make test` with a scope inside the dev image, exactly as a
# contributor does locally. Placeholder jobs mark where each test layer lands;
# each names the ticket that fills it in.
#
# The plan job maps the pull request's diff to the ci-test.sh scopes that
# read it and exposes one output per scope. Each section job needs the plan
# and runs only when its scope is selected; pushes to master and
# workflow_dispatch run every job, and a FULL result runs every job. A job
# skipped by its if still satisfies branch protection, so skipping is safe.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The diff to the scope map. Stdlib-only, so it needs no dev image, and
  # Actions sets GITHUB_ACTIONS so it reports the real scopes, not the
  # cheap local ones.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      lint: ${{ steps.scopes.outputs.lint }}
      scripts: ${{ steps.scopes.outputs.scripts }}
      commits: ${{ steps.scopes.outputs.commits }}
      core: ${{ steps.scopes.outputs.core }}
      gen: ${{ steps.scopes.outputs.gen }}
      bridge: ${{ steps.scopes.outputs.bridge }}
      cpp: ${{ steps.scopes.outputs.cpp }}
      e2e: ${{ steps.scopes.outputs.e2e }}
      coverage: ${{ steps.scopes.outputs.coverage }}
      docs: ${{ steps.scopes.outputs.docs }}
      examples: ${{ steps.scopes.outputs.examples }}
      budgets: ${{ steps.scopes.outputs.budgets }}
      fuzz: ${{ steps.scopes.outputs.fuzz }}
      readme: ${{ steps.scopes.outputs.readme }}
      full: ${{ steps.scopes.outputs.full }}
    steps:
      # Full history: the script diffs against the merge base with the base.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - id: scopes
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          if [ "$base" = "origin/" ]; then base="origin/master"; fi
          python3 scripts/scopes_for_diff.py --base "$base" > scopes.env
          cat scopes.env
          while IFS='=' read -r key value; do
            echo "$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')=$value" >> "$GITHUB_OUTPUT"
          done < scopes.env

  lint:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.lint == '1'
    runs-on: ubuntu-24.04
    steps:
      # Full history: the spec coverage check compares the pending list with the PR's base.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      - run: |
          range="$(bash scripts/pr-title-range.sh)" || exit 1
          COMMIT_RANGE="$range" make test LINT=1
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

  # The SCRIPTS scope runs as one job per shard: shard 0 holds the e2e
  # isolation tests on their own until #337 moves them to the nightly, and
  # the rest spread round-robin over the other shards (scripts/shard_nodes.py).
  scripts:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.scripts == '1'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test SCRIPTS=1 SCRIPTS_SHARD=${{ matrix.shard }}

  core:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.core == '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test CORE=1

  gen:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.gen == '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test GEN=1
  cpp:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.cpp == '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test CPP=1
  docs:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.docs == '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test DOCS=1
  readme:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.readme == '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test README=1
  coverage:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.coverage == '1'
    runs-on: ubuntu-24.04
    steps:
      # Full history: the gate measures the base commit in the same run.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      - run: |
          range="$(bash scripts/pr-title-range.sh)" || exit 1
          COMMIT_RANGE="$range" make test COVERAGE=1
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

  e2e-avr:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.e2e == 'avr' || needs.plan.outputs.e2e == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test E2E=avr

  # The bridge job's distro images, resolved from ci/versions.env before it
  # starts: a job's container is fixed before any step runs, so the bridge job
  # cannot read the file itself. Always runs: it is setup, not a section.
  bridge-images:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
      images: ${{ steps.pins.outputs.images }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: pins
        run: bash scripts/bridge-images.sh >> "$GITHUB_OUTPUT"

  # The bridge is built and tested on every supported distro, in that distro's
  # own pinned image. The dev image is the jazzy one, so the local run and the
  # jazzy job share a toolchain.
  bridge:
    needs: [plan, bridge-images]
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.bridge == '1'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bridge-images.outputs.matrix) }}
    container:
      image: ${{ fromJSON(needs.bridge-images.outputs.images)[matrix.distro] }}
    steps:
      - uses: actions/checkout@v4.2.2
      - run: make test BRIDGE=1
        env:
          R2S_IN_IMAGE: 1
          R2S_BUILD_DIR: /tmp/r2s-build

  # End-to-end on the posix virtual MCU: scenarios 1 to 4 under every RMW the
  # design names, with the Zenoh router started first on its leg. The suite
  # runs the same run.sh locally, so each leg matches `make test E2E=posix`.
  e2e-posix:
    needs: [plan, bridge-images]
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.e2e == 'posix' || needs.plan.outputs.e2e == 'both'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.bridge-images.outputs.matrix).distro }}
        rmw: [rmw_fastrtps_cpp, rmw_cyclonedds_cpp, rmw_zenoh_cpp]
    container:
      image: ${{ fromJSON(needs.bridge-images.outputs.images)[matrix.distro] }}
    steps:
      - uses: actions/checkout@v4.2.2
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends "ros-${DISTRO}-rmw-cyclonedds-cpp" "ros-${DISTRO}-rmw-zenoh-cpp"
        env:
          DISTRO: ${{ matrix.distro }}
      - run: make test E2E=posix
        env:
          R2S_IN_IMAGE: 1
          R2S_BUILD_DIR: /tmp/r2s-build
          R2S_RMWS: ${{ matrix.rmw }}
          # Scenario 8's median bound: the shared host needs headroom above the 1 ms default.
          R2S_SYNC_BOUND_NS: 5000000

  # Placeholders. Each becomes a real job in the ticket it names, and stays
  # out of the required checks until then.
  fuzz-smoke:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.fuzz == '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test FUZZ=1
  build-matrix:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.examples == '1'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test EXAMPLES=1
  budgets:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.budgets == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history: the head numbers are judged by the base commit's tools.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      - run: |
          range="$(bash scripts/pr-title-range.sh)" || exit 1
          export BASE="${range%%..*}"
          set +e
          make test BUDGETS=1 | tee budgets.log
          status=${PIPESTATUS[0]}
          grep '^TABLE ' budgets.log | tail -1 | cut -d' ' -f2 > budgets-table.path
          exit "$status"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      # The table is one click from the run on every push, whether or not the
      # gate passes: an empty path means the builds failed before any table.
      - if: always()
        run: |
          if [ -s budgets-table.path ]; then
            cat "$(cat budgets-table.path)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always() && github.event_name == 'pull_request'
        # Best effort: a fork token cannot comment, and that must not fail the gate.
        continue-on-error: true
        run: |
          [ -s budgets-table.path ] || exit 0
          table="$(cat budgets-table.path)"
          dir="$(dirname "$table")"
          args=(--measurements "$dir/measurements.json" --stack "$dir/stack.json"
            --budgets tools/budgets.yaml --table "$table")
          if [ -f "$dir/base-measurements.json" ] && [ -f "$dir/base-stack.json" ]; then
            args+=(--base-measurements "$dir/base-measurements.json" --base-stack "$dir/base-stack.json")
          fi
          if [ -f "$dir/base-budgets.yaml" ]; then
            args+=(--base-budgets "$dir/base-budgets.yaml")
          fi
          marker='<!-- r2s-budgets -->'
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate -q '[.[] | select(.body | contains("'"$marker"'")) | .id] | last // empty' || true)
          if [ -n "$existing" ]; then args+=(--has-comment 1); else args+=(--has-comment 0); fi
          action=$(python3 scripts/budgets_comment.py "${args[@]}" --out budgets-comment.md) || exit 0
          [ "$action" = skip ] && exit 0
          if [ -n "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$existing" -X PATCH -F "body=@budgets-comment.md"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file budgets-comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: ci

# Every job runs `make test` with a scope inside the dev image, exactly as a
# contributor does locally. Placeholder jobs mark where each test layer lands;
# each names the ticket that fills it in.
#
# The plan job asks Task which ci-test.sh sections are stale and exposes
# one output per section. Each section job needs the plan and runs only
# when its task is stale; pushes to master and
# workflow_dispatch run every job, and a FULL result runs every job. A job
# skipped by its if still satisfies branch protection, so skipping is safe.
#
# Timeouts: every job that builds or pulls an image carries at least 30
# minutes. On a cold GHA cache the image step is slow, and its cache is
# written only when the job completes, so a shorter bound would cut off the
# very run that fills it. plan and bridge-images build nothing and stay at 5.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Master runs force their sections: the landed tree is fully validated and
# its checksums saved. Pull requests run the stale tasks only.
env:
  R2S_FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Change detection by checksum: the plan restores each task's last
  # successful inputs from the latest master run and reports every section
  # whose inputs changed since. A cache miss runs everything; a task that
  # Task itself cannot check fails the plan safe to FULL. Pushes to master
  # run every job forced and save the checksums the section jobs write.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.statuses.outputs.lint }}
      scripts: ${{ steps.statuses.outputs.scripts }}
      # No ci.yml job reads this; COMMITS runs via pr-title.yml instead.
      commits: ${{ steps.statuses.outputs.commits }}
      core: ${{ steps.statuses.outputs.core }}
      gen: ${{ steps.statuses.outputs.gen }}
      bridge: ${{ steps.statuses.outputs.bridge }}
      cpp: ${{ steps.statuses.outputs.cpp }}
      e2e: ${{ steps.statuses.outputs.e2e }}
      esp32: ${{ steps.statuses.outputs.esp32 }}
      coverage: ${{ steps.statuses.outputs.coverage }}
      docs: ${{ steps.statuses.outputs.docs }}
      mermaid: ${{ steps.statuses.outputs.mermaid }}
      examples: ${{ steps.statuses.outputs.examples }}
      budgets: ${{ steps.statuses.outputs.budgets }}
      fuzz: ${{ steps.statuses.outputs.fuzz }}
      nightly: ${{ steps.statuses.outputs.nightly }}
      readme: ${{ steps.statuses.outputs.readme }}
      full: ${{ steps.statuses.outputs.full }}
    steps:
      # Shallow: the status checks read files, not history.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
      - name: Install Task
        run: sudo python3 scripts/install-task.py
      # One checksum file per task, so parallel saves never collide. The
      # branch key falls back to master; only master runs save, so a pull
      # request compares its files against the latest master run.
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/scripts
          key: r2s-task-scripts-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-scripts-${{ github.ref }}-
            r2s-task-scripts-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/core
          key: r2s-task-core-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-core-${{ github.ref }}-
            r2s-task-core-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/gen
          key: r2s-task-gen-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-gen-${{ github.ref }}-
            r2s-task-gen-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/bridge
          key: r2s-task-bridge-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-bridge-${{ github.ref }}-
            r2s-task-bridge-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/cpp
          key: r2s-task-cpp-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-cpp-${{ github.ref }}-
            r2s-task-cpp-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/coverage
          key: r2s-task-coverage-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-coverage-${{ github.ref }}-
            r2s-task-coverage-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/docs
          key: r2s-task-docs-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-docs-${{ github.ref }}-
            r2s-task-docs-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/examples
          key: r2s-task-examples-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-examples-${{ github.ref }}-
            r2s-task-examples-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/budgets
          key: r2s-task-budgets-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-budgets-${{ github.ref }}-
            r2s-task-budgets-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/esp32
          key: r2s-task-esp32-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-esp32-${{ github.ref }}-
            r2s-task-esp32-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/readme
          key: r2s-task-readme-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-readme-${{ github.ref }}-
            r2s-task-readme-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/fuzz
          key: r2s-task-fuzz-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-fuzz-${{ github.ref }}-
            r2s-task-fuzz-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/e2e-avr
          key: r2s-task-e2e-avr-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-e2e-avr-${{ github.ref }}-
            r2s-task-e2e-avr-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/e2e-posix
          key: r2s-task-e2e-posix-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-e2e-posix-${{ github.ref }}-
            r2s-task-e2e-posix-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/nightly
          key: r2s-task-nightly-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-nightly-${{ github.ref }}-
            r2s-task-nightly-refs/heads/master-
      - uses: actions/cache/restore@v4.2.2
        with:
          path: .task/checksum/mermaid
          key: r2s-task-mermaid-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            r2s-task-mermaid-${{ github.ref }}-
            r2s-task-mermaid-refs/heads/master-
      - id: statuses
        run: |
          statuses="$RUNNER_TEMP/status.env"
          full=""
          # A task without a checksum file (lint, commits) is always stale.
          # Exit 0 is fresh, 1 is stale; anything else fails safe to FULL.
          for task in lint commits scripts core gen bridge cpp coverage docs examples esp32 budgets readme fuzz e2e-avr e2e-posix nightly mermaid; do
            rc=0
            task --status "$task" >/dev/null 2>&1 || rc=$?
            case $rc in
              0) value="" ;;
              1) value="1" ;;
              *) full=1; value="" ;;
            esac
            echo "$task=$value" >> "$statuses"
          done
          # The e2e legs share one output with the backend value.
          e2e=""
          avr=$(sed -n 's/^e2e-avr=//p' "$statuses")
          posix=$(sed -n 's/^e2e-posix=//p' "$statuses")
          if [ -n "$avr" ] && [ -n "$posix" ]; then e2e="both"
          elif [ -n "$avr" ]; then e2e="avr"
          elif [ -n "$posix" ]; then e2e="posix"
          fi
          {
            echo "e2e=$e2e"
            echo "full=${full:-}"
          } >> "$statuses"
          cat "$statuses"
          # The legs report through the shared e2e output only.
          while IFS='=' read -r key value; do
            case $key in e2e-avr | e2e-posix) continue ;; esac
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < "$statuses"

  lint:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.lint == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: the spec coverage check compares the pending list with the PR's base.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      - run: |
          range="$(bash scripts/pr-title-range.sh)" || exit 1
          COMMIT_RANGE="$range" make test LINT=1
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

  # The SCRIPTS scope runs as one job per shard over the collected node
  # ids, spread round-robin in sorted order (scripts/shard_nodes.py). The
  # e2e isolation pairs run in the nightly workflow instead.
  scripts:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.scripts == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test SCRIPTS=1 SCRIPTS_SHARD=${{ matrix.shard }}
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/scripts
          key: r2s-task-scripts-refs/heads/master-${{ github.sha }}

  core:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.core == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test CORE=1
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/core
          key: r2s-task-core-refs/heads/master-${{ github.sha }}

  gen:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.gen == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test GEN=1
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/gen
          key: r2s-task-gen-refs/heads/master-${{ github.sha }}
  cpp:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.cpp == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test CPP=1
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/cpp
          key: r2s-task-cpp-refs/heads/master-${{ github.sha }}
  docs:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.docs == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test DOCS=1
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/docs
          key: r2s-task-docs-refs/heads/master-${{ github.sha }}
  # Mermaid blocks, parsed by mermaid itself under the pinned node image
  # (never the dev image, which gains no Node). Runs when markdown or the
  # tool changes; make lint-docs runs the same command locally.
  mermaid:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.mermaid == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/ros2serial/npm
          key: mermaid-npm-${{ hashFiles('tools/mermaid-check/package-lock.json') }}
          restore-keys: |
            mermaid-npm-
      - name: Install Task
        run: sudo python3 scripts/install-task.py
      # The host check runs through its task, so its inputs are checksummed
      # like every section; make lint-docs stays the local entry point.
      - run: task --concurrency 1 mermaid
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/mermaid
          key: r2s-task-mermaid-refs/heads/master-${{ github.sha }}
  readme:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.readme == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test README=1
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/readme
          key: r2s-task-readme-refs/heads/master-${{ github.sha }}
  coverage:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.coverage == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: the gate measures the base commit in the same run.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      - run: |
          range="$(bash scripts/pr-title-range.sh)" || exit 1
          COMMIT_RANGE="$range" make test COVERAGE=1
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/coverage
          key: r2s-task-coverage-refs/heads/master-${{ github.sha }}

  e2e-avr:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.e2e == 'avr' || needs.plan.outputs.e2e == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test E2E=avr
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/e2e-avr
          key: r2s-task-e2e-avr-refs/heads/master-${{ github.sha }}

  # The bridge job's distro images, resolved from ci/versions.env before it
  # starts: a job's container is fixed before any step runs, so the bridge job
  # cannot read the file itself. Always runs: it is setup, not a section.
  bridge-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
      images: ${{ steps.pins.outputs.images }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: pins
        run: bash scripts/bridge-images.sh >> "$GITHUB_OUTPUT"

  # The bridge is built and tested on every supported distro, in that distro's
  # own pinned image. The dev image is the jazzy one, so the local run and the
  # jazzy job share a toolchain.
  bridge:
    needs: [plan, bridge-images]
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.bridge == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bridge-images.outputs.matrix) }}
    container:
      image: ${{ fromJSON(needs.bridge-images.outputs.images)[matrix.distro] }}
    steps:
      - uses: actions/checkout@v4.2.2
      # The distro images carry no dev image: the runner installs pinned Task.
      - name: Install Task
        run: python3 scripts/install-task.py
      - run: make test BRIDGE=1
        env:
          R2S_IN_IMAGE: 1
          R2S_BUILD_DIR: /tmp/r2s-build
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/bridge
          key: r2s-task-bridge-refs/heads/master-${{ github.sha }}

  # End-to-end on the posix virtual MCU: scenarios 1 to 4 under every RMW the
  # design names, with the Zenoh router started first on its leg. The suite
  # runs the same run.sh locally, so each leg matches `make test E2E=posix`.
  e2e-posix:
    needs: [plan, bridge-images]
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.e2e == 'posix' || needs.plan.outputs.e2e == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.bridge-images.outputs.matrix).distro }}
        rmw: [rmw_fastrtps_cpp, rmw_cyclonedds_cpp, rmw_zenoh_cpp]
    container:
      image: ${{ fromJSON(needs.bridge-images.outputs.images)[matrix.distro] }}
    steps:
      - uses: actions/checkout@v4.2.2
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends "ros-${DISTRO}-rmw-cyclonedds-cpp" "ros-${DISTRO}-rmw-zenoh-cpp"
        env:
          DISTRO: ${{ matrix.distro }}
      # The distro images carry no dev image: the runner installs pinned Task.
      - name: Install Task
        run: python3 scripts/install-task.py
      - run: make test E2E=posix
        env:
          R2S_IN_IMAGE: 1
          R2S_BUILD_DIR: /tmp/r2s-build
          R2S_RMWS: ${{ matrix.rmw }}
          # Scenario 8's median bound: pinned to the 5 ms default for the shared host.
          R2S_SYNC_BOUND_NS: 5000000
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/e2e-posix
          key: r2s-task-e2e-posix-refs/heads/master-${{ github.sha }}

  # Placeholders. Each becomes a real job in the ticket it names, and stays
  # out of the required checks until then.
  fuzz-smoke:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.fuzz == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test FUZZ=1
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/fuzz
          key: r2s-task-fuzz-refs/heads/master-${{ github.sha }}
  # The nightly jobs on a pull request that touches them: the plan selects
  # NIGHTLY for the isolation pairs, and the long fuzzing stays off unless
  # the same plan also selects FUZZ. The soak never runs here: two hours is
  # a schedule-only wait. A reusable workflow call takes no timeout-minutes;
  # the called jobs carry theirs.
  nightly:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.nightly == '1'
    uses: ./.github/workflows/nightly-jobs.yml
    with:
      fuzz: ${{ needs.plan.outputs.fuzz == '1' }}
      soak: false
      # Mutation testing is nightly-only: it never runs in a pull request.
      mutation: false
  build-matrix:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.examples == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - run: make test EXAMPLES=1
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/examples
          key: r2s-task-examples-refs/heads/master-${{ github.sha }}

  # The ESP32 check: the example sketches and the staged Arduino library
  # compile for the ESP32 Dev Module at the core version pinned in
  # ci/versions.env. The core lives outside the dev image, so the check
  # installs it into a cache directory the build script manages.
  esp32:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.esp32 == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/ros2serial/arduino-esp32
          key: esp32-core-${{ hashFiles('ci/versions.env') }}
          restore-keys: |
            esp32-core-
      - run: make test ESP32=1
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/esp32
          key: r2s-task-esp32-refs/heads/master-${{ github.sha }}
  budgets:
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.full == '1' || needs.plan.outputs.budgets == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history: the head numbers are judged by the base commit's tools.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-image
      # The budgets build compiles the ESP32 firmware too, so it restores
      # the same cached core the esp32 job installs.
      - uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/ros2serial/arduino-esp32
          key: esp32-core-${{ hashFiles('ci/versions.env') }}
          restore-keys: |
            esp32-core-
      - run: |
          range="$(bash scripts/pr-title-range.sh)" || exit 1
          export BASE="${range%%..*}"
          set +e
          make test BUDGETS=1 | tee budgets.log
          status=${PIPESTATUS[0]}
          grep '^TABLE ' budgets.log | tail -1 | cut -d' ' -f2 > budgets-table.path
          exit "$status"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4.2.2
        with:
          path: .task/checksum/budgets
          key: r2s-task-budgets-refs/heads/master-${{ github.sha }}
      # The table is one click from the run on every push, whether or not the
      # gate passes: an empty path means the builds failed before any table.
      - if: always()
        run: |
          if [ -s budgets-table.path ]; then
            cat "$(cat budgets-table.path)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always() && github.event_name == 'pull_request'
        # Best effort: a fork token cannot comment, and that must not fail the gate.
        continue-on-error: true
        run: |
          [ -s budgets-table.path ] || exit 0
          table="$(cat budgets-table.path)"
          dir="$(dirname "$table")"
          args=(--measurements "$dir/measurements.json" --stack "$dir/stack.json"
            --budgets tools/budgets.yaml --table "$table")
          if [ -f "$dir/base-measurements.json" ] && [ -f "$dir/base-stack.json" ]; then
            args+=(--base-measurements "$dir/base-measurements.json" --base-stack "$dir/base-stack.json")
          fi
          if [ -f "$dir/base-budgets.yaml" ]; then
            args+=(--base-budgets "$dir/base-budgets.yaml")
          fi
          marker='<!-- r2s-budgets -->'
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate -q '[.[] | select(.body | contains("'"$marker"'")) | .id] | last // empty' || true)
          if [ -n "$existing" ]; then args+=(--has-comment 1); else args+=(--has-comment 0); fi
          action=$(python3 scripts/budgets_comment.py "${args[@]}" --out budgets-comment.md) || exit 0
          [ "$action" = skip ] && exit 0
          if [ -n "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$existing" -X PATCH -F "body=@budgets-comment.md"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file budgets-comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: pr-body

# A body written with an inline "\n" string renders as one line on GitHub.
# The body reaches the check through the environment, never the shell command.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  newlines:
    runs-on: ubuntu-24.04
    steps:
      # The script comes from the base branch, so a PR cannot relax its own check.
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      # Only the PR that introduces the check has no base copy; it runs its own.
      - if: hashFiles('scripts/pr_body_check.py') == ''
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: PR body uses real newlines
        env:
          PR_BODY_TEXT: ${{ github.event.pull_request.body }}
        run: python3 scripts/pr_body_check.py --env PR_BODY_TEXT

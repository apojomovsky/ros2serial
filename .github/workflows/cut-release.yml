name: cut-release

# Manual release cut. `prepare` computes the next version from the commits,
# updates VERSION, the generator's version files and CHANGELOG.md, and opens a
# release PR set to auto-merge; `tag` tags the merge when VERSION changes on
# master. Both push with the
# R2S_RELEASE_TOKEN secret (a personal access token): a PR or tag pushed with
# the default GITHUB_TOKEN never triggers other workflows, so the release PR's
# required checks would never run and release.yml would never start.
# Auto-merge needs "Allow auto-merge" enabled in the repository settings.
# The release PR is squashed like every other PR, so the commit on master
# carries the PR number after the subject, and the tag job matches the
# subject and the subject with the number.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Only print the next version and the changelog
        type: boolean
        default: true
  push:
    branches: [master]
    paths: [VERSION]

permissions:
  contents: read

concurrency: release

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the release token
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.R2S_RELEASE_TOKEN }}
        run: test -n "$TOKEN" || { echo "set the R2S_RELEASE_TOKEN secret first"; exit 1; }
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ inputs.dry_run && github.token || secrets.R2S_RELEASE_TOKEN }}
      - name: Load pinned versions
        run: grep -v '^#' ci/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install git-cliff
        run: python3 -m pip install "git-cliff==${GIT_CLIFF_VERSION}"
      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          BUMP: ${{ inputs.bump }}
        run: bash scripts/release.sh --dry-run --bump "$BUMP"
      - name: Release commit and PR
        if: ${{ !inputs.dry_run }}
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.R2S_RELEASE_TOKEN }}
        run: |
          git config user.name "release"
          git config user.email "release@users.noreply.github.com"
          set -o pipefail
          git switch -c release-cut
          bash scripts/release.sh --bump "$BUMP" | tee release.log
          version=$(sed -n 's/^next version: //p' release.log)
          rm release.log
          test -n "$version" || { echo "release.sh printed no version"; exit 1; }
          git branch -m "release/v${version}"
          git push -u origin "release/v${version}"
          gh pr create --base master --title "chore(release): v${version}" \
            --body "Release v${version}: VERSION, the generator's version files and CHANGELOG.md from scripts/release.sh."
          gh pr merge --auto --squash

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.R2S_RELEASE_TOKEN || github.token }}
      - name: Tag the release
        env:
          TOKEN: ${{ secrets.R2S_RELEASE_TOKEN }}
        run: |
          version=$(cat VERSION)
          subject=$(git log -1 --format=%s -- VERSION)
          if [ "$version" = 0.0.0 ]; then
            echo "VERSION is 0.0.0: nothing has been released yet"
          elif ! bash scripts/release-subject.sh "$version" "$subject"; then
            echo "VERSION last changed by \"$subject\", not by a release commit: cut releases with this workflow"
            exit 1
          elif git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} already tagged"
          elif [ -z "$TOKEN" ]; then
            echo "set the R2S_RELEASE_TOKEN secret: a tag pushed with the default token would not start release.yml"
            exit 1
          else
            git tag "v${version}"
            git push origin "v${version}"
          fi

name: ci-infra-retry

# One rerun for a failed master run that died of infrastructure trouble.
# Master runs never cancel each other, so a red master commit is either a
# real failure or a proxy that answered 5xx: this flow reruns the failed
# jobs once when every failed log reads as an HTTP 5xx with no test
# failure, and keeps the conclusion otherwise. The run_attempt guard means
# the rerun itself never reruns.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash scripts/ci-infra-retry.sh "$RUN_ID"

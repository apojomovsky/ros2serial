name: release

# Releases from a maintainer's v* tag: build the Arduino library zip from
# the G11 bundle and the Python sdist and wheel, and attach them to a GitHub
# release. A plain version tag becomes a full release marked Latest; a tag
# with a SemVer pre-release suffix (as in v0.2.0-rc.1) becomes a pre-release.
# Nothing is published elsewhere: no PyPI, no Arduino Library Manager, no
# buildfarm. Pull requests touching this workflow or the artifact script, and
# manual dispatches, run the same build without publishing. The tag is pushed
# by hand once the milestone closes, never by this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts without publishing
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-release-artifacts.sh

permissions:
  contents: read

concurrency: release

jobs:
  # The nightly jobs gate the publish, so no release ships with them red.
  # Only on a tag: a pull request touching this file still runs the build
  # below without publishing, and so does a manual dispatch. The long
  # fuzzing stays on the schedule: its findings land in the seed corpus.
  nightly:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/nightly-jobs.yml
    with:
      fuzz: false
      soak: false
      # Mutation testing is nightly-only: it never gates a release either.
      mutation: false
      # The big-endian qemu job is schedule-only too: a first-run failure
      # is triaged through the scheduled failure reporter, not a blocked
      # publish.
      bigendian: false

  release:
    needs: [nightly]
    # The nightly gate only binds on a tag: a skipped caller (a pull request
    # or a dispatch) still builds below, while a red one blocks the publish.
    if: always() && (needs.nightly.result == 'success' || needs.nightly.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/dev-image
      - name: Build the release artifacts
        run: make exec CMD='bash scripts/build-release-artifacts.sh --out dist'
      - name: Refuse a tag the repository version does not name
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(tr -d '[:space:]' <VERSION)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME names no release: VERSION is $version"
            exit 1
          }
      - name: Read the changelog section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(tr -d '[:space:]' <VERSION)
          awk -v prefix="## $version " '
            substr($0, 1, length(prefix)) == prefix { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=$(bash scripts/release-flags.sh "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" "$flag" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*

name: pr-title

# The PR is squashed into one commit on master, so each of its commits must
# follow the commit rules; the title follows them too for consistency, and
# the title must carry what the commits declare.
# The same run applies the prose gate to everything the PR adds, and checks
# the repository's merge settings, which are what make the squash the only
# merge.
# Separate from ci.yml so editing a title re-checks only this. It runs on the
# runner's Python, not the dev image: the check needs only the standard library
# and git, and building the image for every title edit would be waste.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Load pinned versions
        run: grep -v '^#' ci/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: PR title and commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: COMMITS=1 bash scripts/ci-test.sh
      - name: The repository's merge settings
        # The rule is what the settings allow, so they are checked where a
        # token is available. The dev image has no gh.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/merge-settings.sh "${{ github.repository }}"

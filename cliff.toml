# git-cliff configuration: the changelog cut-release.yml (#10) generates.
#
# A breaking change carries ! in its subject. Breaking means a change to the
# wire protocol, the C API, the C++ APIs, the r2s.yaml schema, the X-macro
# syntax, the bridge parameters or the generator's CLI (AGENTS.md, Commit
# hygiene). Wire changes also bump R2S_PROTOCOL_VERSION.

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
# The comment prefixes only order the sections; they don't render.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^build", group = "<!-- 7 -->Build" },
  { message = "^ci", group = "<!-- 8 -->CI" },
  { message = "^revert", group = "<!-- 9 -->Reverts" },
  { message = "^chore", group = "<!-- 10 -->Chores" },
]

name: service_call
covers: [SVR-4, SVR-5, SVR-6, REL-3]
# Exchange only, like param_set_reliable: the harness handshakes first, then
# drives the host calls.
steps:
  - from: host
    frame: "07 00 04 00 00 00 4d 66"
    at_ms: 0
    note: "ROS call: REQUEST rel 0, req 0, index 0, the empty Trigger request"
  - from: mcu
    frame: "06 00 07 00 b3 05"
    at_ms: 0
  - from: mcu
    frame: "07 00 05 00 00 00 01 02 6f 6b 58 5d"
    at_ms: 50
    note: "RESPONSE rel 0, req 0, ok, the packed Trigger response"
  - from: host
    frame: "06 00 07 00 b3 05"
    at_ms: 50
  - from: mcu
    frame: "07 01 04 01 01 00 0d 2e"
    at_ms: 100
    note: "MCU call: REQUEST rel 1, req 1, index 0, the empty Trigger request; its own rel stream"
  - from: host
    frame: "06 01 07 01 e6 4e"
    at_ms: 100
  - from: host
    frame: "07 01 05 01 01 00 01 02 6f 6b 5b 8b"
    at_ms: 150
    note: "ROS answer: RESPONSE rel 1, req 1, ok; the host rel stream"
  - from: mcu
    frame: "06 01 07 01 e6 4e"
    at_ms: 150
